<style>
  :root{
    --plum:#3a2450;--grape:#5b3a7e;--rose:#ff7eb6;--peach:#ffc26f;
    --cream:#fff4ea;--mint:#8be3d0;--ink:#2c1a3d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--cream);
    background:linear-gradient(160deg,#2a1740 0%,#4a2a6b 45%,#7a3f7e 78%,#b5527e 100%);
    background-attachment:fixed;min-height:100vh;overflow-x:hidden;
    position:relative;text-align:center;padding:0 20px 120px;
  }
  .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .float{position:absolute;bottom:-60px;animation:rise linear infinite;}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0;}10%{opacity:.7;}90%{opacity:.7;}100%{transform:translateY(-118vh) rotate(360deg);opacity:0;}}

  .wrap{position:relative;z-index:2;max-width:440px;margin:0 auto;padding-top:38px;}
  .eyebrow{font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;font-weight:700;color:var(--peach);opacity:.9;margin-bottom:6px;}
  h1{font-family:'Pacifico',cursive;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1.05;font-weight:400;color:#fff;text-shadow:0 3px 0 rgba(255,126,182,.5),0 6px 20px rgba(0,0,0,.35);margin-bottom:4px;}
  .name{position:relative;z-index:3;font-family:'Pacifico',cursive;font-size:clamp(3.4rem,17vw,5rem);background:linear-gradient(90deg,var(--peach),var(--rose),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));line-height:1.6;padding-bottom:.35em;margin-bottom:0;overflow:visible;}

  .twenty{position:relative;z-index:1;display:inline-block;margin:10px auto 34px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;}
  .twenty .cake{font-size:4.4rem;line-height:1;display:inline-block;vertical-align:-.15em;margin-right:6px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));animation:cakebob 2.6s ease-in-out infinite;}
  @keyframes cakebob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-4px) rotate(4deg);}}
  .twenty .num{font-family:'Pacifico',cursive;font-size:5rem;line-height:1;background:linear-gradient(180deg,#fff,#ffe2c2);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 6px;}
  @keyframes pop{0%{transform:scale(0) rotate(-15deg);}100%{transform:scale(1) rotate(0);}}

  .frame{position:relative;width:min(80vw,300px);margin:40px auto 6px;animation:sway 5s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}
  .frame img{width:100%;display:block;border-radius:22px;border:6px solid #fff;box-shadow:0 14px 30px rgba(0,0,0,.4);}
  .frame .tape{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-4deg);width:110px;height:26px;background:rgba(255,194,111,.75);border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .ear{position:absolute;top:-30px;font-size:2.9rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));z-index:3;}
  .ear.l{left:-6px;transform:rotate(-22deg);}
  .ear.r{right:-6px;transform:rotate(22deg) scaleX(-1);}
  .peek{position:absolute;bottom:-34px;right:-6px;font-size:3rem;z-index:1;animation:peekpop 3.5s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));}
  @keyframes peekpop{0%,70%,100%{transform:translateY(14px) rotate(6deg);}80%,90%{transform:translateY(-6px) rotate(6deg);}}
  .paws{font-size:1.6rem;letter-spacing:8px;margin:22px 0 6px;opacity:.9;}

  /* cat row now bobs on its own */
  .catrow{display:flex;justify-content:center;gap:8px;margin:6px 0 20px;font-size:2.4rem;}
  .catrow span{display:inline-block;animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-10px) rotate(-6deg);}}

  .card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:22px;padding:22px 20px;margin:0 auto 22px;box-shadow:0 10px 26px rgba(0,0,0,.18);text-align:left;}
  .card h2{font-family:'Pacifico',cursive;font-weight:400;font-size:1.5rem;color:var(--peach);margin-bottom:10px;text-align:center;}
  .card p{font-size:1.02rem;line-height:1.6;color:#fdeede;font-weight:600;}
  .card p + p{margin-top:10px;}

  /* auto-rotating cat line, no button */
  .cat-say{margin-top:8px;min-height:30px;font-weight:700;font-size:1.1rem;color:var(--mint);transition:opacity .5s ease;}

  footer{margin-top:30px;font-size:.85rem;opacity:.7;font-weight:600;}
  .heart{color:var(--rose);}

  .walker{position:fixed;bottom:8px;left:-60px;font-size:2.6rem;z-index:5;pointer-events:none;animation:walk 14s linear infinite;}
  @keyframes walk{0%{left:-60px;transform:scaleX(1);}48%{left:100%;transform:scaleX(1);}50%{left:100%;transform:scaleX(-1);}98%{left:-60px;transform:scaleX(-1);}100%{left:-60px;transform:scaleX(1);}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;}.walker{display:none;}}
</style>
</head>

<script>
  var sky=document.getElementById('sky');
  var items=['🐱','🎈','🐾','😺','🐈','💛','🐱','✨','🐾','🐈‍⬛','🎀','😻'];
  var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!reduce){
    for(var i=0;i<16;i++){
      var e=document.createElement('div');e.className='float';e.textContent=items[i%items.length];
      e.style.left=(Math.random()*100)+'%';e.style.fontSize=(20+Math.random()*26)+'px';
      var dur=9+Math.random()*10;e.style.animationDuration=dur+'s';e.style.animationDelay=(-Math.random()*dur)+'s';
      sky.appendChild(e);
    }
  }

  function confetti(){
    if(reduce) return;
    var colors=['#ff7eb6','#ffc26f','#8be3d0','#fff4ea','#c58bff'];
    var emo=['🐱','🐈','😺','😻','🐾','🎉','⭐','💛','🐈‍⬛'];
    for(var i=0;i<22;i++){
      var p=document.createElement('div');
      var useEmoji=Math.random()>.4;
      if(useEmoji){p.textContent=emo[Math.floor(Math.random()*emo.length)];p.style.fontSize=(18+Math.random()*18)+'px';}
      else{p.style.width=p.style.height=(8+Math.random()*8)+'px';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.borderRadius=Math.random()>.5?'50%':'2px';}
      p.style.position='fixed';p.style.zIndex=1;p.style.left=(Math.random()*100)+'%';p.style.top='-30px';p.style.pointerEvents='none';
      document.body.appendChild(p);
      var drift=(Math.random()*160-80), rot=(Math.random()*720-360);
      p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+drift+'px,'+(window.innerHeight+80)+'px) rotate('+rot+'deg)',opacity:.9}],{duration:3500+Math.random()*2500,easing:'linear'}).onfinish=function(){this.effect.target.remove();};
    }
  }

  // auto-cycling cat message
  var quips=['meow means happy birthday in cat 🐱','20 lives, not just 9! 😺','you are purr-fect just as you are 🐾','hope your day is as cute as a kitten 🐈','may your year be full of naps and treats 😽','somebody thinks you\'re amazing (it\'s me) 💛','the cats agree: you\'re the best 🐈‍⬛'];
  var qi=0, say=document.getElementById('catSay');
  setInterval(function(){
    say.style.opacity=0;
    setTimeout(function(){qi=(qi+1)%quips.length;say.textContent=quips[qi];say.style.opacity=1;},500);
  },3500);

  // confetti on its own: a welcome burst, then a gentle rain every few seconds
  window.addEventListener('load',function(){
    confetti();
    setTimeout(confetti,700);
    setInterval(confetti,5500);
  });
</script>
